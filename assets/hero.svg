<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <linearGradient id="topo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="topo-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow-topo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#topo-bg)"/>

  <!-- Topological Simplicial Complex Graphic Right -->
  <g transform="translate(880, 180)">
    <!-- Filled Simplex Triangles -->
    <polygon points="-80,-90 60,-110 -20,20" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="60,-110 140,-20 -20,20" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5"/>
    <polygon points="-20,20 140,-20 80,100" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="-20,20 80,100 -100,80" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"/>
    <polygon points="-100,80 -80,-90 -20,20" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Persistent Homology Barcode Lines Below -->
    <line x1="-120" y1="130" x2="120" y2="130" stroke="#1e293b" stroke-width="1"/>
    <line x1="-100" y1="140" x2="60" y2="140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="150" x2="110" y2="150" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="160" x2="40" y2="160" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

    <!-- Complex Nodes -->
    <circle cx="-80" cy="-90" r="5" fill="#38bdf8"/>
    <circle cx="60" cy="-110" r="6" fill="#8b5cf6"/>
    <circle cx="140" cy="-20" r="5" fill="#6366f1"/>
    <circle cx="80" cy="100" r="6" fill="#a855f7"/>
    <circle cx="-100" cy="80" r="4.5" fill="#06b6d4"/>
    <circle cx="-20" cy="20" r="7" fill="#3b82f6" filter="url(#glow-topo)"/>
  </g>

  <!-- Left Header Tag -->
  <rect x="70" y="55" width="310" height="26" rx="13" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="85" cy="68" r="4" fill="#3b82f6"/>
  <text x="98" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#60a5fa">ALGEBRAIC TOPOLOGY // SUPPLY CHAIN</text>

  <!-- Main Hero Title -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#f8fafc">Topo<tspan fill="#3b82f6">Chain</tspan></text>

  <!-- Subtitle Tagline -->
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Multimodal Software Supply-Chain Integrity &amp; Topological Drift Detection</text>

  <!-- Description paragraph -->
  <text x="70" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#64748b">Persistent Homology · AST Simplicial Complexes · PyTorch Topological Neural Networks · Backdoor Detection</text>

  <!-- Capability Badges -->
  <g transform="translate(70, 275)">
    <rect width="155" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="77.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93c5fd">PERSISTENT HOMOLOGY</text>
  </g>
  <g transform="translate(235, 275)">
    <rect width="145" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93c5fd">AST COMPLEXES</text>
  </g>
  <g transform="translate(390, 275)">
    <rect width="145" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93c5fd">PYTORCH TNN</text>
  </g>
  <g transform="translate(545, 275)">
    <rect width="135" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="67.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#93c5fd">ROC-AUC 1.00</text>
  </g>
</svg>
